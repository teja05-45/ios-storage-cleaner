# Runtime validation for the Reclaim iOS app.
#
# Why this exists: the primary development environment for this repository is
# Windows (no Apple toolchain), so `xcodebuild` Debug/Release builds and the
# XCTest suite have never executed. GitHub's macOS runners are the first
# available Apple toolchain; this workflow runs the exact validation sequence
# from docs/18–20 on every push to main.
#
# All build/test output is tee'd to files and uploaded as artifacts, so every
# PASS/FAIL claim in the validation docs can be traced to a raw log.

name: iOS Validation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Build + Test (macOS)
    runs-on: macos-14
    timeout-minutes: 60

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -E '^iOS' || true

      # First-launch preparation on fresh runners: xcodebuild can fail with
      # EX_IOERR (exit 74) before the package has accepted its license and
      # platform support has been installed. idempotent, no-ops when ready.
      - name: Prepare Xcode first launch
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -runFirstLaunch || true
          sudo xcodebuild -license accept || true
          xcodebuild -checkFirstLaunchStatus || true

      # Grammar-level gate on the generated project file: the workflow's
      # first five runs all failed at xcodebuild with exit 74 because one
      # emitted entry lacked its terminating ';'. A real OpenStep-plist
      # parse catches that class of defect in seconds, with a message that
      # names the line — unlike xcodebuild's "damaged project" error.
      - name: Validate generated project file
        run: python scripts/validate_pbxproj.py

      # Apple's own plist linter is the definitive grammar oracle; our
      # parser passes the file but Xcode still rejected it on the runner,
      # so a second opinion on macOS costs nothing. stderr is surfaced as
      # an annotation because only that channel is readable without
      # repository-admin log access.
      - name: plutil lint of project file
        run: |
          mkdir -p Logs
          set +e
          plutil -lint Reclaim.xcodeproj/project.pbxproj > Logs/plutil.txt 2>&1
          status=$?
          set -e
          cat Logs/plutil.txt
          if [ $status -ne 0 ]; then
            echo "::error::plutil -lint exit $status: $(tr '\n' ' ' < Logs/plutil.txt | tail -c 700)"
          fi
          exit $status

      # tee targets below require the directory to exist (run 1 failed here:
      # pipefail turned tee's "No such file or directory" into a step failure).
      - name: Prepare logs directory
        run: mkdir -p Logs

      # xcodebuild's stdout is NOT piped anywhere: run 2 exited 74 (EX_IOERR)
      # with `… | tee` under pipefail — an output-I/O failure, not a build
      # failure. The robust CI pattern is redirect-to-file, then cat, which
      # also guarantees the full log is in the step output when the step fails.
      # A failing step emits its log tail as a ::error annotation (single-line)
      # and into the job summary, so the cause is readable without repository-
      # admin log access. set +e/--set -e bracketing is REQUIRED: GitHub's
      # default shell runs with -e, which otherwise aborts before diagnostics.
      # Step 2 of the validation sequence: discover the actual project,
      # scheme, target, and test target — recorded in the log.
      - name: xcodebuild -list
        run: |
          set +e
          xcodebuild -list -project Reclaim.xcodeproj > Logs/xcodebuild-list.txt 2>&1
          status=$?
          set -e
          cat Logs/xcodebuild-list.txt
          if [ $status -ne 0 ]; then
            tail -c 1500 Logs/xcodebuild-list.txt > Logs/list-error-tail.txt || true
            echo "### xcodebuild -list failed (exit $status)" >> "$GITHUB_STEP_SUMMARY"
            cat Logs/list-error-tail.txt >> "$GITHUB_STEP_SUMMARY" || true
            echo "::error::xcodebuild -list exit $status: $(tr '\n' ' ' < Logs/list-error-tail.txt | tail -c 700)"
          fi
          exit $status

      - name: Debug build
        run: |
          set +e
          xcodebuild clean build \
            -project Reclaim.xcodeproj \
            -scheme Reclaim \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            > Logs/debug-build.txt 2>&1
          status=$?
          set -e
          tail -100 Logs/debug-build.txt
          if [ $status -ne 0 ]; then
            grep -E "error: " Logs/debug-build.txt | head -20 > Logs/debug-errors.txt || true
            echo "::error::Debug build exit $status, first errors: $(tr '\n' '|' < Logs/debug-errors.txt | tail -c 3900)"
          fi
          exit $status

      # Steps 6–8: run the complete XCTest suite (ReclaimTests unit bundle,
      # TestTargetID-linked to the app target).
      - name: Run XCTest suite
        run: |
          set +e
          xcodebuild test \
            -project Reclaim.xcodeproj \
            -scheme Reclaim \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
            > Logs/xctest.txt 2>&1
          status=$?
          set -e
          grep -E "Test Suite '(All tests|ReclaimTests)'|Executed .* tests" Logs/xctest.txt || true
          tail -60 Logs/xctest.txt
          if [ $status -ne 0 ]; then
            grep -E "error: |failed \(" Logs/xctest.txt | head -20 > Logs/test-errors.txt || true
            echo "::error::xcodebuild test exit $status, first errors: $(tr '\n' '|' < Logs/test-errors.txt | tail -c 3900)"
          fi
          exit $status

      # Step 9: Release build.
      - name: Release build
        run: |
          set +e
          xcodebuild build \
            -project Reclaim.xcodeproj \
            -scheme Reclaim \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            > Logs/release-build.txt 2>&1
          status=$?
          set -e
          tail -100 Logs/release-build.txt
          if [ $status -ne 0 ]; then
            grep -E "error: " Logs/release-build.txt | head -20 > Logs/release-errors.txt || true
            echo "::error::Release build exit $status, first errors: $(tr '\n' '|' < Logs/release-errors.txt | tail -c 3900)"
          fi
          exit $status

      - name: Summarize test results
        if: always()
        run: |
          {
            echo "## XCTest summary"
            echo '```'
            grep -E "Test Suite '(All tests|ReclaimTests)'" Logs/xctest.txt | tail -4 || true
            grep -E "Executed [0-9]+ tests?" Logs/xctest.txt | tail -2 || true
            grep -cE "^\s+Test Case .* passed" Logs/xctest.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: Logs/
          retention-days: 14
